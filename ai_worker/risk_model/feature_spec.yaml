# 예측 입력 계약 (초안 v0.1)
# - 키는 ERD v1.3 컬럼명 그대로 (API 명세서 03 구역 공통 규칙 "예측 입력")
# - knhanes: 국민건강영양조사 변수명. 응답 코드 대응은 단계 1에서 이용지침서 확인 후 채움
# - 02 문진 필드·선택지가 확정되면 범위·단위를 맞춰 최종본으로 올림
# - 혈압·혈당·검진 수치·진단·복약 정보는 입력에 넣지 않음 (라벨 누수 방지)
version: 0.1
fields:
  age:                      {type: int,   required: true,  min: 19,  max: 110, source: "users.birth_date로 계산", knhanes: [age]}
  gender:                   {type: enum,  required: true,  values: [MALE, FEMALE], source: users.gender, knhanes: [sex]}
  height:                   {type: float, required: true,  min: 100, max: 220, unit: cm, source: questionnaires.height, knhanes: [HE_ht]}
  weight:                   {type: float, required: true,  min: 20,  max: 250, unit: kg, source: "health_logs.weight 최신 → 없으면 questionnaires.weight", knhanes: [HE_wt]}
  waist_size:               {type: float, required: true,  min: 40,  max: 200, unit: cm, source: "health_logs.waist_size 최신 → 없으면 questionnaires.waist_size", knhanes: [HE_wc]}
  smoking_status:           {type: enum,  required: true,  values: [NEVER, FORMER, CURRENT], source: questionnaires.smoking_status, knhanes: [BS3_1, BS1_1]}
  drinking_days_per_week:   {type: int,   required: false, min: 0, max: 7,  source: questionnaires, knhanes: [BD1_11]}
  drinks_per_occasion:      {type: int,   required: false, min: 0, max: 30, unit: 잔, source: questionnaires, knhanes: [BD2_1]}
  activity_days_per_week:   {type: int,   required: false, min: 0, max: 7,  source: questionnaires, knhanes: [pa_aerobic]}
  activity_minutes_per_day: {type: int,   required: false, min: 0, max: 600, unit: 분, source: questionnaires, knhanes: [pa_aerobic]}
  strength_days_per_week:   {type: int,   required: false, min: 0, max: 7,  source: questionnaires, knhanes: [BE5_1]}
  veg_freq:                 {type: int,   required: false, min: 0, max: 21, unit: "주당 횟수 (초안, 문진 선택지 확정 필요)", source: questionnaires, knhanes: [LS_VEG1]}
  fruit_freq:               {type: int,   required: false, min: 0, max: 21, unit: "주당 횟수 (초안, 문진 선택지 확정 필요)", source: questionnaires, knhanes: [LS_FRUIT]}
  breakfast_freq:           {type: int,   required: false, min: 0, max: 7,  unit: "주당 횟수 (초안, 문진 선택지 확정 필요)", source: questionnaires, knhanes: [L_BR_FQ]}
  sleep_hours:              {type: float, required: false, min: 0, max: 24, unit: 시간, source: "checkins 14일 중 7일 이상이면 평균 → 아니면 questionnaires.sleep_hours", knhanes: [BP16_1, BP16_2, BP16_11, BP16_12, BP16_13, BP16_14]}
  family_htn:               {type: enum,  required: false, values: ["YES", "NO", "UNKNOWN"], source: questionnaires, knhanes: [HE_HPfh1, HE_HPfh2, HE_HPfh3]}
  family_dm:                {type: enum,  required: false, values: ["YES", "NO", "UNKNOWN"], source: questionnaires, knhanes: [HE_DMfh1, HE_DMfh2, HE_DMfh3]}
  family_dl:                {type: enum,  required: false, values: ["YES", "NO", "UNKNOWN"], source: questionnaires, knhanes: [HE_HLfh1, HE_HLfh2, HE_HLfh3]}
  menopause_status:         {type: enum,  required: false, values: [PRE, PERI, POST], source: "questionnaires (여성만)", knhanes: [LW_ms]}

# 모델에 넣지 않는 문진 항목 (국건영에 문항이 없어 추천용으로만 사용)
recommendation_only: [salty_food_freq, sweet_food_freq, refined_carb_freq, sleep_trouble, quit_intention, exercise_restricted]

# 입력에 들어오면 오류로 처리하는 값 (라벨을 정하는 값이라 누수가 됨)
forbidden: [pressure_systolic, pressure_diastolic, blood_glucose, fasting_glucose, hba1c, total_cholesterol, ldl, hdl, triglyceride,
            htn_diagnosed, htn_medication, dm_diagnosed, dm_medication, dl_diagnosed, dl_medication]
