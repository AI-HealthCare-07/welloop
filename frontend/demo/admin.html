<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>WELLOOP 관리자 (데모)</title><link rel="stylesheet" href="style.css">
<style>#phone{max-width:900px} main{padding-bottom:40px}</style>
</head>
<body>
<div id="phone"><header id="top"><b>WELLOOP 관리자</b><span id="demo-tag">데모</span></header><main id="view"></main></div>
<script>
/* 관리자 데모 화면 (F01~F04). 개인 건강 정보는 보여 주지 않고 집계·콘텐츠만 다뤄요 (NFR-016). */
const $ = (s) => document.querySelector(s), view = $("#view");
let token = null;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DISEASE = { HYPERTENSION: "고혈압", DIABETES: "당뇨", DYSLIPIDEMIA: "이상지질혈증" };
const CAT = { DIET: "식습관", ACTIVITY: "신체활동", SLEEP_REST: "수면·휴식", SMOKE_DRINK: "금연·절주" };
const KIND = { RISK_SIGNAL: "위험 신호", MEDICAL_BAN: "의료 표현 금지", FAMILY_BAN: "가족 문구 금지" };
async function api(path, method = "GET", body) {
  const res = await fetch("/api/v1/admin" + path, { method, headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const data = res.status === 204 ? null : await res.json().catch(() => null);
  if (!res.ok) throw new Error(data?.detail || "요청을 처리하지 못했어요");
  return data;
}
function login() {
  view.innerHTML = `<h1>관리자 로그인</h1><label>이메일</label><input id="email" type="email"><label>비밀번호</label><input id="pw" type="password">
    <p id="err" class="error"></p><button class="btn" id="go">로그인</button><p class="sub">계정 만들기: python -m app.create_admin 이메일</p>`;
  $("#go").onclick = async () => { try { token = (await api("/login", "POST", { email: $("#email").value, password: $("#pw").value })).access_token; dash(); } catch (e) { $("#err").textContent = e.message; } };
}
async function dash() {
  const [s, th, ch, kw] = await Promise.all([api("/stats"), api("/thresholds"), api("/challenges"), api("/safety-keywords")]);
  view.innerHTML = `<h1>운영 현황</h1>
    <div class="card"><div class="row"><div><p class="sub">가입자</p><div class="big-num">${s.total_users}</div></div><div><p class="sub">최근 7일 활동</p><div class="big-num">${s.active_users_7d}</div></div>
      <div><p class="sub">미션 달성률</p><div class="big-num">${Math.round(s.mission_completion_rate * 100)}%</div></div></div>
      <p class="sub">코치 메시지 ${s.coach_messages}건 · LLM 호출 ${s.llm_calls}건 · 모델 ${s.model_versions.map((m) => esc(m.model_version) + " (" + m.users + "명)").join(", ") || "-"}</p></div>
    <div class="card"><h2>위험 단계 경계값</h2><p class="sub">${esc(th.note)}</p><table><tr><th>질환</th><th>주의 시작</th><th>높음 시작</th><th></th></tr>
      ${th.items.map((t) => `<tr><td>${DISEASE[t.disease_type]}</td><td><input type="number" step="0.01" id="w-${t.disease_type}" value="${t.warning_from}"></td>
        <td><input type="number" step="0.01" id="h-${t.disease_type}" value="${t.high_from}"></td><td><button class="link" data-th="${t.disease_type}">저장</button></td></tr>`).join("")}</table><p id="th-err" class="error"></p></div>
    <div class="card"><h2>챌린지 (${ch.total})</h2><table>${ch.items.map((c) => `<tr><td><span class="chip">${CAT[c.category]}</span></td><td>${esc(c.title)}</td>
        <td>${c.is_active ? "사용 중" : `<span class="sub">비활성</span>`}</td><td>${c.is_active ? `<button class="link" data-off="${c.challenge_id}">비활성화</button>` : ""}</td></tr>`).join("")}</table>
      <div class="row" style="margin-top:10px"><select id="c-cat">${Object.entries(CAT).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select><input id="c-title" type="text" placeholder="새 챌린지 이름"></div>
      <p id="c-err" class="error"></p><button class="btn ghost" id="c-add">챌린지 추가</button></div>
    <div class="card"><h2>안전 키워드 (${kw.total})</h2><table>${kw.items.map((k) => `<tr><td><span class="chip ${k.kind === "RISK_SIGNAL" ? "HIGH" : "muted"}">${KIND[k.kind]}</span></td><td>${esc(k.keyword)}</td>
        <td><button class="link" data-kdel="${k.keyword_id}">삭제</button></td></tr>`).join("")}</table>
      <div class="row" style="margin-top:10px"><select id="k-kind">${Object.entries(KIND).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select><input id="k-word" type="text" placeholder="새 키워드"></div>
      <p id="k-err" class="error"></p><button class="btn ghost" id="k-add">키워드 추가</button></div>
    <div class="card"><h2>최근 관리자 작업</h2>${s.recent_admin_logs.map((g) => `<p class="sub">${esc(g.created_at.slice(0, 16).replace("T", " "))} · ${esc(g.action)} · ${esc(g.target)}</p>`).join("") || `<p class="sub">아직 없어요.</p>`}</div>`;
  const act = (sel, errId, fn) => document.querySelectorAll(sel).forEach((b) => b.onclick = async () => { try { await fn(b); dash(); } catch (e) { $(errId).textContent = e.message; } });
  act("[data-th]", "#th-err", (b) => api("/thresholds/" + b.dataset.th, "PUT", { warning_from: Number($("#w-" + b.dataset.th).value), high_from: Number($("#h-" + b.dataset.th).value) }));
  act("[data-off]", "#c-err", (b) => api("/challenges/" + b.dataset.off, "DELETE"));
  act("#c-add", "#c-err", () => api("/challenges", "POST", { category: $("#c-cat").value, title: $("#c-title").value }));
  act("[data-kdel]", "#k-err", (b) => api("/safety-keywords/" + b.dataset.kdel, "DELETE"));
  act("#k-add", "#k-err", () => api("/safety-keywords", "POST", { keyword: $("#k-word").value, kind: $("#k-kind").value }));
}
login();
</script>
</body>
</html>
